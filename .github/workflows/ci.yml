name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # composite action (no Node runtime); pinned to the Flutter version used locally
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
